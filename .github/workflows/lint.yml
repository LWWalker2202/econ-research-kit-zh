name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint markdown content
        run: python3 scripts/lint_content.py .

      - name: Check actions.csv loads
        run: python3 scripts/show_table.py --lang en > /dev/null
