name: parity

# Checks that this repository and its language mirror have the same tree,
# the same section structure, the same acceptance counts, and the same
# byte-identical shared files.
#
# No setup needed: the mirror is derived from this repository's name
# (econ-research-kit <-> econ-research-kit-zh) and both are public.
# Override with a repository variable MIRROR_REPO = <owner>/<repo>
# (Settings -> Secrets and variables -> Actions -> Variables) if you
# renamed the pair or work from a fork.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve mirror repository
        run: |
          mirror="${{ vars.MIRROR_REPO }}"
          if [ -z "$mirror" ]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY##*/}"
            if [ "$name" = "econ-research-kit-zh" ]; then
              mirror="$owner/econ-research-kit"
            else
              mirror="$owner/econ-research-kit-zh"
            fi
            echo "MIRROR_REPO is not set; using $mirror"
          fi
          echo "MIRROR_REPO=$mirror" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: self

      - name: Clone the mirror
        run: |
          git clone --depth 1 "https://github.com/${MIRROR_REPO}.git" mirror

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Arrange directories by language
        run: |
          if [ "${GITHUB_REPOSITORY##*/}" = "econ-research-kit-zh" ]; then
            mv self econ-research-kit-zh
            mv mirror econ-research-kit
          else
            mv self econ-research-kit
            mv mirror econ-research-kit-zh
          fi

      - name: Run parity check
        run: python3 econ-research-kit/scripts/check_parity.py

      - name: Check mirror is not stale
        run: |
          lag=$(( ( $(date +%s) - $(date -d "$(git -C mirror log -1 --format=%cI)" +%s) ) / 86400 ))
          echo "mirror last commit: $lag day(s) ago"
          if [ "$lag" -gt 7 ]; then
            echo "::warning::the mirror has not been updated in $lag days"
          fi
